name: Validate and test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  markers:
    name: Check README markers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check markers exist exactly once and in order
        run: |
          s=$(grep -c "<!-- RECENT_ACTIVITY:START -->" README.md || true)
          e=$(grep -c "<!-- RECENT_ACTIVITY:END -->" README.md || true)
          if [ "$s" -ne 1 ] || [ "$e" -ne 1 ]; then
            echo "::error::README markers missing or duplicated (start=$s end=$e)"
            exit 1
          fi
          start_line=$(grep -n "<!-- RECENT_ACTIVITY:START -->" README.md | cut -d: -f1)
          end_line=$(grep -n "<!-- RECENT_ACTIVITY:END -->" README.md | cut -d: -f1)
          if [ "$start_line" -ge "$end_line" ]; then
            echo "::error::START marker must come before END marker"
            exit 1
          fi
          echo "Markers OK"

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v