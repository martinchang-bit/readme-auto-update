name: Update README

on:
  schedule:
    - cron: "0 0 * * *"        # 每天 UTC 00:00（台灣 08:00）
  workflow_dispatch:            # 手動觸發
  push:
    branches: [main]
    paths-ignore:
      - "README.md"             # 避免 bot 推 README 後無限迴圈

permissions:
  contents: read                # 預設最小權限

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write           # 只有這個 job 能寫入
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update README section
        run: python scripts/update_readme.py
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}

      - name: Commit only if changed
        run: |
          if git diff --quiet README.md; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(readme): update recent activity"
          git push